<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>爱点评</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./imgs/favicon.png">
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">

  <link href="./css/index.css" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet">

  <style type="text/css">
      .el-input__inner {
          border-radius: 20px;
      }
  </style>
  <!-- 启动画面：是否已展示过在页面解析前判断（sessionStorage 记录，同一标签页会话内只展示一次，关闭后重新进入会再次展示） -->
  <script>
    (function () {
      try {
        if (sessionStorage.getItem('aidp_splash_shown') === '1') {
          document.documentElement.classList.add('no-splash');
        } else {
          document.documentElement.classList.add('splash-lock');
        }
      } catch (e) { }
    })();
  </script>
  <style type="text/css">
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 99999;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.7s ease;
    }
    .splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-4vh);
    }
    .splash-logo {
      display: block;
      width: 140px;
      height: 140px;
    }
    .splash-slogan {
      display: block;
      width: 300px;
      max-width: 70vw;
      height: auto;
      margin-top: 16px;
    }
    #splash.splash-out {
      opacity: 0;
      pointer-events: none;
    }
    .no-splash #splash {
      display: none;
    }
    html.splash-lock,
    html.splash-lock body {
      overflow: hidden;
    }
  </style>
</head>
<body>
<div id="splash">
  <div class="splash-inner">
    <img class="splash-logo" src="./imgs/logo.png" alt="爱点评">
    <img class="splash-slogan" src="./imgs/slogan.png" alt="发现身边的好味道！">
  </div>
</div>
<script>
  (function () {
    var splash = document.getElementById('splash');
    if (!splash) { return; }
    var root = document.documentElement;
    if (root.classList.contains('no-splash')) {
      splash.parentNode.removeChild(splash);
      return;
    }
    // 展示 1.5 秒后启动 0.7 秒淡出，露出主页；同时在本标签页会话中记录已展示
    setTimeout(function () {
      try { sessionStorage.setItem('aidp_splash_shown', '1'); } catch (e) { }
      splash.classList.add('splash-out');
      setTimeout(function () {
        if (splash.parentNode) { splash.parentNode.removeChild(splash); }
        root.classList.remove('splash-lock');
      }, 750);
    }, 1500);
  })();
</script>
<div id="app">
  <div class="search-bar">
    <div class="city-btn">杭州 <i class="el-icon-arrow-down"></i></div>
    <div class="search-input">
      <el-input size="mini" placeholder="请输入商户名、地点">
        <i slot="prefix" class="el-input__icon el-icon-search"></i>
      </el-input>
    </div>
    <div class="header-icon" @click="toPage(4)"><i class="el-icon-user"></i></div>
  </div>
  <div class="type-list" :class="{'type-hide': hideTypes}">
    <div class="type-box" v-for="t in types" :key="t.id" @click="toShopList(t.id, t.name)">
      <div class="type-view"><img :src="'/imgs/' + t.icon" alt=""></div>
      <div class="type-text">{{t.name}}</div>
    </div>
  </div>
  <div class="blog-list" :class="{'list-full': hideTypes}" @scroll="onScroll" ref="blogList">
    <div class="blog-box" v-for="b in blogs" :key="b.id">
      <div class="blog-img" @click="toBlogDetail(b)"><img :src="b.img" alt=""></div>
      <div class="blog-title">{{b.title}}</div>
      <div class="blog-foot">
        <div class="blog-user-icon"><img :src="b.icon || '/imgs/icons/default-icon.png'" alt=""></div>
        <div class="blog-user-name">{{b.name}}</div>
        <div class="blog-liked" @click="addLike(b)">
          <svg t="1646634642977" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="2187" width="14" height="14">
            <path d="M160 944c0 8.8-7.2 16-16 16h-32c-26.5 0-48-21.5-48-48V528c0-26.5 21.5-48 48-48h32c8.8 0 16 7.2 16 16v448zM96 416c-53 0-96 43-96 96v416c0 53 43 96 96 96h96c17.7 0 32-14.3 32-32V448c0-17.7-14.3-32-32-32H96zM505.6 64c16.2 0 26.4 8.7 31 13.9 4.6 5.2 12.1 16.3 10.3 32.4l-23.5 203.4c-4.9 42.2 8.6 84.6 36.8 116.4 28.3 31.7 68.9 49.9 111.4 49.9h271.2c6.6 0 10.8 3.3 13.2 6.1s5 7.5 4 14l-48 303.4c-6.9 43.6-29.1 83.4-62.7 112C815.8 944.2 773 960 728.9 960h-317c-33.1 0-59.9-26.8-59.9-59.9v-455c0-6.1 1.7-12 5-17.1 69.5-109 106.4-234.2 107-364h41.6z m0-64h-44.9C427.2 0 400 27.2 400 60.7c0 127.1-39.1 251.2-112 355.3v484.1c0 68.4 55.5 123.9 123.9 123.9h317c122.7 0 227.2-89.3 246.3-210.5l47.9-303.4c7.8-49.4-30.4-94.1-80.4-94.1H671.6c-50.9 0-90.5-44.4-84.6-95l23.5-203.4C617.7 55 568.7 0 505.6 0z" p-id="2188" :fill="b.isLike ? '#ff6633' : '#82848a'"></path>
          </svg>
          {{b.liked}}
        </div>
      </div>
    </div>
  </div>
  <div class="back-top" :class="{'back-top-show': showBackTop}" @click="goTop">
    <i class="el-icon-top"></i>
  </div>
  <foot-bar :active-btn="1"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script src="./js/footer.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      isReachBottom: false,
      hideTypes: false, // 商品标签栏是否收起
      showBackTop: false, // 是否显示返回顶部按钮
      lastScrollTop: 0, // 上一次的滚动位置，用于判断滚动方向
      downScroll: 0, // 向下滑动累计距离
      upScroll: 0, // 向上滑动累计距离
      typeToggleTime: 0, // 上次收起/展开的时间，动画期间忽略判断
      types: [], // 类型列表
      blogs: [], // 播客列表
      current: 1,// blog的页码
    },
    created() {
      // 查询类型
      this.queryTypes();
      this.queryHotBlogsScroll();
    },
    methods: {
      queryTypes() {
        axios.get("/shop-type/list")
          .then(({data}) => {
            this.types = data;
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      queryHotBlogsScroll() {
        axios.get("/blog/hot?current=" + this.current)
          .then(({data}) => {
            data.forEach(b => b.img = b.images.split(",")[0]);
            this.blogs = this.blogs.concat(data);
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      addLike(b) {
        axios.put("/blog/like/" +b.id)
          .then(({data}) => {
            this.queryBlogById(b)
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      queryBlogById(b) {
        axios.get("/blog/" + b.id)
          .then(({data}) => {
            b.liked = data.liked;
            b.isLike = data.isLike;
          })
          .catch(() => {
            this.$message.error
            b.liked ++;
          })
      },
      onScroll(e) {
        let scrollTop = e.target.scrollTop;
        let offsetHeight = e.target.offsetHeight;
        let scrollHeight = e.target.scrollHeight;

        // 往下滚动一段距离就显示返回顶部按钮
        this.showBackTop = scrollTop > 40;

        // 向下滑：收起商品标签栏；向上滑：展开标签栏
        this.updateTypeBar(scrollTop);

        if (scrollTop + offsetHeight > scrollHeight && !this.isReachBottom) {
          this.isReachBottom = true

          // 再次查询下一页数据
          this.current++;
          this.queryHotBlogsScroll();
        } else {
          this.isReachBottom = false
        }
      },
      updateTypeBar(scrollTop) {
        // 回到顶部必定展开
        if (scrollTop <= 40) {
          this.hideTypes = false;
          this.downScroll = 0;
          this.upScroll = 0;
          this.lastScrollTop = scrollTop;
          return;
        }

        // 按方向累计滑动距离，反向滑动时清零，避免手指轻微抖动来回切换
        let delta = scrollTop - this.lastScrollTop;
        this.lastScrollTop = scrollTop;
        if (delta > 0) {
          this.upScroll = 0;
          this.downScroll += delta;
        } else if (delta < 0) {
          this.downScroll = 0;
          this.upScroll -= delta;
        }

        // 收起/展开动画会改变列表高度，浏览器会补发一个小幅回弹的滚动事件，
        // 动画期间只累计距离、不切换状态
        let now = Date.now();
        if (now - this.typeToggleTime < 300) {
          return;
        }

        // 同一方向累计滑动超过 24px 才切换
        if (!this.hideTypes && this.downScroll >= 24) {
          this.hideTypes = true;
          this.typeToggleTime = now;
          this.downScroll = 0;
          this.upScroll = 0;
        } else if (this.hideTypes && this.upScroll >= 24) {
          this.hideTypes = false;
          this.typeToggleTime = now;
          this.downScroll = 0;
          this.upScroll = 0;
        }
      },
      goTop() {
        let blogList = this.$refs.blogList;
        if (!blogList) {
          return;
        }
        // 平滑滚回列表顶部，上滑过程中标签栏会自动展开
        if (blogList.scrollTo) {
          blogList.scrollTo({top: 0, behavior: "smooth"});
        } else {
          blogList.scrollTop = 0;
        }
      },
      toShopList(id, name) {
        location.href = "/shop-list.html?type=" + id + "&name=" + name
      },
      toBlogDetail(b) {
        location.href = "/blog-detail.html?id=" + b.id
      }
    }
  })
</script>
</body>
</html>
